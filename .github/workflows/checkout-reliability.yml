name: Pruebas de fiabilidad de la tienda

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "index.html"
      - "sw.js"
      - "como-pagar-recargas-juegos-cuba.html"
      - "recargas-juegos-cuba.html"
      - "recargar-free-fire-cuba.html"
      - "recargar-blood-strike-cuba.html"
      - "recargar-mobile-legends-cuba.html"
      - "recargar-pubg-mobile-cuba.html"
      - "recargar-arena-breakout-cuba.html"
      - "sobre-tienda-el-castillo.html"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - "tienda-el-castillo/**"
      - "tests/**"
      - "assets/checkout-reliability.js"
      - "assets/coronas-promotions.js"
      - "assets/coronas-promotions.css"
      - "supabase/functions/central-one-order/**"
      - "supabase/functions/central-one-player-validate/**"
      - "supabase/migrations/**"
  push:
    branches:
      - main
      - release/coronas-wallet-cutover
    paths:
      - ".github/workflows/**"
      - "index.html"
      - "sw.js"
      - "recargas-juegos-cuba.html"
      - "recargar-free-fire-cuba.html"
      - "recargar-blood-strike-cuba.html"
      - "recargar-mobile-legends-cuba.html"
      - "recargar-pubg-mobile-cuba.html"
      - "recargar-arena-breakout-cuba.html"
      - "sobre-tienda-el-castillo.html"
      - "como-pagar-recargas-juegos-cuba.html"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - "tienda-el-castillo/**"
      - "tests/**"
      - "assets/checkout-reliability.js"
      - "assets/coronas-promotions.js"
      - "assets/coronas-promotions.css"
      - "supabase/functions/central-one-order/**"
      - "supabase/functions/central-one-player-validate/**"
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  checkout-reliability:
    name: Ejecutar pruebas de tienda, SEO y promociones
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ejecutar pruebas automatizadas
        run: node --test tests/checkout-reliability.test.cjs tests/ai-visibility-id-cuba.test.cjs tests/turnstile-mobile-performance.test.cjs
      - name: Comprobar sintaxis de scripts incrustados
        run: node tests/check-inline-scripts.cjs
